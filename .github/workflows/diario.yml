name: yacarepy-diario
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pipeline
        env:
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python modulo1_ingesta.py
      - name: Publicar datos actualizados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "YacarePy: reporte diario automatico"
          file_pattern: alertas.geojson deforestacion.geojson
